name: Bug Report
description: Report a bug, crash, or unexpected behavior in HART
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: checkboxes
    id: terms
    attributes:
      label: Pre-flight Checks
      description: Please confirm the following before submitting.
      options:
        - label: I have searched the existing issues to ensure this bug has not already been reported.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug or crash.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can I reproduce this? Please include the exact RISC-V assembly snippet if the bug is emulator-related.
      placeholder: |
        1. Open HART.
        2. Enter the following assembly: `...`
        3. Step forward three times.
        4. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead? (e.g., "The PC should jump to 0x14, but it jumps to 0x00")
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: What OS and version of HART are you running? (e.g., macOS 14.2 / Windows 11, HART v0.1.0)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, Screenshots, or Terminal Output
      description: Paste any relevant error messages from the developer console, terminal, or upload screenshots here.
    validations:
      required: false
