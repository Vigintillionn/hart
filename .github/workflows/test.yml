name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: build + test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up GHC and Cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6"
          cabal-version: "latest"

      - name: Cache ~/.cabal/store
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            emulator/dist-newstyle
          key: ${{ runner.os }}-ghc-9.6-${{ hashFiles('emulator/**/*.cabal', 'emulator/**/cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-ghc-9.6-

      - name: Update Cabal
        working-directory: ./emulator
        run: cabal update

      - name: Build dependencies
        working-directory: ./emulator
        run: cabal build all --only-dependencies

      - name: Build project
        working-directory: ./emulator
        run: cabal build all

      - name: Run tests
        working-directory: ./emulator
        run: cabal test all
