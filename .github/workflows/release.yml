name: "Release"
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: exclude workspace from Defender (windows)
        if: matrix.platform == 'windows-latest'
        continue-on-error: true
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}"

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./frontend

      - name: install system dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: setup haskell
        id: setup-haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6"
          cabal-version: "latest"

      - name: cache cabal store + build
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup-haskell.outputs.cabal-store }}
            emulator/dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('emulator/**/*.cabal', 'emulator/cabal.project.freeze') }}
          restore-keys: |
            ${{ runner.os }}-cabal-

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: cache rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
          shared-key: release

      - name: build haskell sidecar
        run: bash build-sidecar.sh
        working-directory: ./frontend

      - name: build and release tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "HART ${{ github.ref_name }}"
          releaseBody: "Generating release notes..."
          releaseDraft: true
          prerelease: false
          projectPath: ./frontend

  changelog:
    name: release notes
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes from conventional commits
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write notes into the draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --notes-file RELEASE_NOTES.md
